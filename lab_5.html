<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laboratorio Interactivo - Análisis con Burp Suite</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2333; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#ff6f2c; --accent2:#f778ba;
    --green:#3fb950; --red:#f85149; --yellow:#d29922; --blue:#58a6ff;
    font-family:'Segoe UI', system-ui, sans-serif; color:var(--text); background:var(--bg);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{display:flex; height:100vh; overflow:hidden; background:var(--bg);}
  /* ---------- Sidebar pasos ---------- */
  #sidebar{width:290px; min-width:290px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column;}
  .brand{padding:18px 16px; border-bottom:1px solid var(--border);}
  .brand h1{font-size:17px; color:var(--accent);}
  .brand small{color:var(--muted); font-size:11px;}
  #steps{flex:1; overflow-y:auto; padding:10px;}
  .step{display:flex; gap:10px; align-items:flex-start; padding:10px; border-radius:8px; cursor:pointer; border:1px solid transparent;}
  .step:hover{background:var(--panel2);}
  .step.active{background:var(--panel2); border-color:var(--accent);}
  .step.done .num{background:var(--green); color:#fff;}
  .step .num{width:26px;height:26px;min-width:26px;border-radius:50%;background:var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .step .info b{font-size:13px; display:block;}
  .step .info span{font-size:11px; color:var(--muted);}
  .progress-wrap{padding:12px 16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted);}
  .bar{height:6px; background:var(--border); border-radius:4px; margin-top:6px; overflow:hidden;}
  .bar>div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .4s;}
  /* ---------- Main ---------- */
  #main{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  #content{flex:1; overflow-y:auto; padding:24px 32px;}
  .tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:12px; text-transform:uppercase;}
  .tag.obj{background:#1f3a5f; color:var(--blue);}
  .tag.warn{background:#4a2f0d; color:var(--yellow);}
  h2{font-size:22px; margin:10px 0 4px;}
  .desc{color:var(--muted); font-size:13px; margin-bottom:18px; max-width:820px; line-height:1.5;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px;}
  .card h3{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:10px;}
  code, pre{font-family:'Cascadia Code',Consolas,monospace;}
  pre{background:#0a0e14; border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12px; line-height:1.55; overflow-x:auto; white-space:pre;}
  .btn{background:var(--accent); color:#111; font-weight:700; border:none; border-radius:8px; padding:10px 18px; cursor:pointer; font-size:13px;}
  .btn:hover{filter:brightness(1.15);}
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  input[type=text], input[type=password], select{background:#0a0e14; border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:8px 10px; font-family:monospace; font-size:13px;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0;}
  .feedback{margin-top:12px; padding:10px 14px; border-radius:8px; font-size:13px; display:none;}
  .feedback.ok{display:block; background:#12261e; border:1px solid var(--green); color:var(--green);}
  .feedback.err{display:block; background:#2f1414; border:1px solid var(--red); color:var(--red);}
  .feedback.info{display:block; background:#14202f; border:1px solid var(--blue); color:var(--blue);}
  /* tabs proxy */
  .tabs{display:flex; gap:4px; margin-bottom:0;}
  .tab{padding:8px 16px; background:var(--panel); border:1px solid var(--border); border-bottom:none; border-radius:8px 8px 0 0; font-size:12px; cursor:pointer; color:var(--muted);}
  .tab.active{background:#0a0e14; color:var(--accent); border-color:var(--accent);}
  .tabbody{border:1px solid var(--border); border-radius:0 8px 8px 8px; padding:14px;}
  .pill{font-size:11px; padding:2px 8px; border-radius:10px; background:var(--border);}
  .light{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--red);}
  .light.on{background:var(--green); box-shadow:0 0 8px var(--green);}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{padding:8px 10px; border-bottom:1px solid var(--border); text-align:left;}
  th{color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:1px;}
  .sev{font-weight:700; padding:2px 8px; border-radius:10px; font-size:11px;}
  .sev.high{background:#2f1414; color:var(--red);} .sev.med{background:#3a2f0d; color:var(--yellow);} .sev.low{background:#14202f; color:var(--blue);}
  footer{padding:14px 32px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .hint{font-size:12px; color:var(--muted); font-style:italic;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:900px){ .grid2{grid-template-columns:1fr;} body{flex-direction:column; overflow:auto; height:auto;} #sidebar{width:100%; min-width:0; border-right:none; border-bottom:1px solid var(--border);} #main{overflow:visible;} #content{overflow:visible;} }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <h1>🕷️ Burp Suite Lab</h1>
    <small>Laboratorio interactivo de análisis web · Solo con fines educativos</small>
  </div>
  <nav id="steps"></nav>
  <div class="progress-wrap">
    Progreso: <span id="progTxt">0 / 7 módulos</span>
    <div class="bar"><div id="progBar"></div></div>
  </div>
</aside>

<main id="main">
  <div id="content"></div>
  <footer>
    <span class="hint" id="hint"></span>
    <span style="display:flex; gap:10px;">
      <button class="btn ghost" id="btnReset" onclick="resetLab()">Reiniciar</button>
      <button class="btn" id="btnNext" onclick="nextStep()" disabled>Siguiente ▶</button>
    </span>
  </footer>
</main>

<script>
/* =========================================================
   ESTADO DEL LABORATORIO
   Objetivo: auditar la web ficticia "http://vulnbank.lab"
   Nunca se envían datos reales: todo es simulación local.
========================================================= */
var STATE = {
  step: 0,
  done: [false,false,false,false,false,false,false],
  proxyOn: false,
  intercepted: null,
  decoded: null,
  intruderFound: false,
  repeaterFound: false,
  score: 0
};

var STEPS = [
  { t:"Configurar el Proxy", s:"Intercept ON y navegador apuntando a 127.0.0.1:8080" },
  { t:"Interceptar tráfico", s:"Captura la petición de login de VulnBank" },
  { t:"Analizar la petición", s:"Inspecciona cabeceras, cookies y parámetros" },
  { t:"Repeater", s:"Manipula y reenvía peticiones: descubre IDOR" },
  { t:"Intruder", s:"Fuerza bruta al token de sesión con Sniper" },
  { t:"Decoder", s:"Descodifica el valor Base64 oculto" },
  { t:"Informe final", s:"Resumen de hallazgos y severidades" }
];

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderSidebar(){
  var html = "";
  STEPS.forEach(function(st,i){
    html += '<div class="step '+(i===STATE.step?"active":"")+' '+(STATE.done[i]?"done":"")+'" onclick="goStep('+i+')">'
      + '<div class="num">'+(STATE.done[i]?"✓":(i+1))+'</div><div class="info"><b>'+esc(st.t)+'</b><span>'+esc(st.s)+'</span></div></div>';
  });
  $("steps").innerHTML = html;
  var n = STATE.done.filter(Boolean).length;
  $("progTxt").textContent = n+" / 7 módulos";
  $("progBar").style.width = Math.round(n/7*100)+"%";
  $("btnNext").disabled = !STATE.done[STATE.step];
}

function loadStep(){
  var c = $("content");
  c.innerHTML = VIEWS[STATE.step]();
  $("hint").textContent = HINTS[STATE.step];
  renderSidebar();
  window.scrollTo? c.scrollTop = 0 : null;
  c.scrollTop = 0;
}
function goStep(i){ STATE.step = i; loadStep(); }
function nextStep(){ if(STATE.step < 6 && STATE.done[STATE.step]){ STATE.step++; loadStep(); } }
function complete(){
  STATE.done[STATE.step] = true;
  STATE.score += 10;
  renderSidebar();
  $("btnNext").disabled = false;
  fb("ok","✔ Módulo completado. Puedes continuar con el siguiente paso.");
}
function fb(kind,msg){
  var el = $("fb"); if(!el) return;
  el.className = "feedback "+kind;
  el.innerHTML = msg;
}
function resetLab(){
  STATE = { step:0, done:[false,false,false,false,false,false,false], proxyOn:false,
            intercepted:null, decoded:null, intruderFound:false, repeaterFound:false, score:0 };
  loadStep();
}

/* =========================================================
   DATOS SIMULADOS DE LA APLICACIÓN VULNERABLE (vulnbank.lab)
========================================================= */
var LOGIN_REQUEST =
"POST /api/login HTTP/1.1\r\n" +
"Host: vulnbank.lab\r\n" +
"User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)\r\n" +
"Cookie: session=eyJhbGciOiJIUzI1NiJ9.dXNlcj0xMjM7cm9sZT1ndWVzdA.a3F4\r\n" +
"Content-Type: application/x-www-form-urlencoded\r\n" +
"Content-Length: 37\r\n" +
"\r\n" +
"username=angel&password=Passw0rd!&remember=1";

var HINTS = [
  "Activa el intercept: el tráfico solo se captura cuando el intercept está ON.",
  "En Burp real: Proxy → Intercept → Intercept is on. Luego navega en el navegador proxy.",
  "Truco: envía la petición al Repeater con Ctrl+R (atajo por defecto).",
  "El Repeater permite reenviar la misma petición infinitas veces variando un parámetro.",
  "El Intruder marca posiciones con §token§. El payload 42 responde 200 OK.",
  "El Decoder de Burp detecta Base64 automáticamente (panel inteligente).",
  "Un buen informe clasifica por severidad: Crítica, Alta, Media, Baja."
];

/* =========================================================
   VISTAS (una por paso)
========================================================= */
var VIEWS = [];

/* -------- PASO 0: Proxy -------- */
VIEWS[0] = function(){
  return '<span class="tag obj">Módulo 1 · Proxy</span>'
  + '<h2>Configurar el Proxy de Burp</h2>'
  + '<p class="desc">Burp Suite actúa como <b>man-in-the-middle entre tu navegador y la aplicación objetivo</b>. '
  + 'Todo el tráfico HTTP/S pasa por el proxy local en <code>127.0.0.1:8080</code>. '
  + 'Objetivo: levantar el proxy, confiar en el certificado CA de Burp y comprobar la conectividad.</p>'
  + '<div class="grid2">'
  + '<div class="card"><h3>Pasos en Burp Suite</h3><pre>1. Proxy → Options → Add listener\n     Bind address: 127.0.0.1   Port: 8080\n2. Navegador → configurar proxy HTTP/S a 127.0.0.1:8080\n3. Visitar http://burp/cert e instalar el certificado CA\n4. Intercept: ON</pre></div>'
  + '<div class="card"><h3>Simulador del panel Proxy</h3>'
  + '<div class="row"><span class="light" id="proxyLight"></span> Intercept is <b id="proxyStateTxt" style="color:var(--red)">OFF</b></div>'
  + '<div class="row"><button class="btn" onclick="toggleProxy()" id="proxyBtn">Activar Intercept</button></div>'
  + '<div class="row" style="margin-top:14px"><span class="pill">Target: http://vulnbank.lab</span><span class="pill">Listener: 127.0.0.1:8080</span></div>'
  + '<div id="fb" class="feedback"></div></div></div>';
};
function toggleProxy(){
  STATE.proxyOn = !STATE.proxyOn;
  $("proxyLight").className = "light" + (STATE.proxyOn?" on":"");
  $("proxyStateTxt").textContent = STATE.proxyOn ? "ON":"OFF";
  $("proxyStateTxt").style.color = STATE.proxyOn ? "var(--green)":"var(--red)";
  $("proxyBtn").textContent = STATE.proxyOn ? "Desactivar Intercept":"Activar Intercept";
  if(STATE.proxyOn){
    fb("info"," Intercept ON — el proxy ahora retiene cada petición antes de reenviarla al servidor.");
    setTimeout(function(){ if(STATE.step===0) complete(); }, 900);
  } else fb("err"," Intercept OFF — el tráfico fluye sin ser retenido.");
}

/* -------- PASO 1: Intercept -------- */
VIEWS[1] = function(){
  if(!STATE.proxyOn)
    return '<span class="tag warn">Atención</span><h2>Interceptar tráfico</h2>'
    + '<p class="desc">El intercept está desactivado. Vuelve al <b>Módulo 1</b> y activa el proxy antes de capturar tráfico.</p>'
    + '<button class="btn ghost" onclick="goStep(0)">◀ Volver al Proxy</button>';
  return '<span class="tag obj">Módulo 2 · Intercept</span>'
  + '<h2>Capturar la petición de login</h2>'
  + '<p class="desc">Con el intercept ON, navega a <code>http://vulnbank.lab/login</code>, rellena el formulario '
  + 'y pulsa «Login». Burp retiene la petición. Pulsa el botón para simular la navegación y capturarla.</p>'
  + '<div class="card"><h3>Simulador del navegador (vía proxy)</h3>'
  + '<div class="row"><input type="text" id="loginUser" placeholder="usuario" value="angel" style="width:180px">'
  + '<input type="password" id="loginPass" placeholder="contraseña" value="Passw0rd!" style="width:180px">'
  + '<button class="btn" onclick="doLogin()">Login ▶</button></div></div>'
  + '<div id="fb" class="feedback"></div>'
  + '<div class="card" id="interceptCard" style="display:none"><h3>Proxy → Intercept (petición retenida)</h3>'
  + '<pre id="reqBox"></pre>'
  + '<div class="row"><button class="btn" onclick="sendRepeater()">Enviar a Repeater (Ctrl+R)</button>'
  + '<button class="btn ghost" onclick="forwardReq()">Forward ⏩</button></div></div>';
};
function doLogin(){
  STATE.intercepted = LOGIN_REQUEST;
  $("interceptCard").style.display = "block";
  $("reqBox").textContent = STATE.intercepted;
  fb("info","⏸ Petición HTTP retenida por el proxy. Burp muestra método, ruta, cabeceras y cuerpo.");
  complete();
}
function forwardReq(){ fb("err","No la reenvíes aún: primero envíala al Repeater (Módulo 4) para manipularla."); }
function sendRepeater(){ fb("ok","Petición cargada en la pestaña Repeater (Módulo 4)."); }

/* -------- PASO 2: Análisis de petición -------- */
VIEWS[2] = function(){
  return '<span class="tag obj">Módulo 3 · Análisis</span>'
  + '<h2>Analizar la petición interceptada</h2>'
  + '<p class="desc">Un analista lee la petición línea a línea. Responde a las preguntas sobre la petición capturada.</p>'
  + '<div class="card"><h3>Petición capturada</h3><pre>'+esc(LOGIN_REQUEST)+'</pre></div>'
  + '<div class="card" id="quizCard"><h3>Cuestionario del analista</h3>'
  + q(1,"¿Qué método y endpoint transporta las credenciales?","POST /api/login",
      ["GET /login","POST /api/login","CONNECT /api/session"])
  + q(2,"La cookie session=eyJhbGciOiJIUzI1NiJ9… parece un…","Token JWT (Base64url por segmentos)",
      ["Token CSRF","Token JWT (Base64url por segmentos)","Identificador PHPSESSID"])
  + q(3,"¿Qué dato sensible viaja en claro en el cuerpo?","La contraseña en texto plano",
      ["La contraseña en texto plano","El hash SHA-256 del usuario","Un token OTP"])
  + '<button class="btn" onclick="gradeQuiz()">Corregir</button><div id="fb" class="feedback"></div></div>';
};
function q(n,title,correct,opts){
  var h = '<div style="margin:12px 0"><b style="font-size:13px">'+n+'. '+esc(title)+'</b>';
  opts.forEach(function(o,i){
    h += '<div class="row"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">'
      + '<input type="radio" name="q'+n+'" value="'+esc(o)+'"> <span style="font-size:13px">'+esc(o)+'</span></label></div>';
  });
  return h + '</div>';
}
function gradeQuiz(){
  var ans = {1:"POST /api/login",2:"Token JWT (Base64url por segmentos)",3:"La contraseña en texto plano"};
  var ok = 0;
  [1,2,3].forEach(function(n){
    var sel = document.querySelector('input[name=q'+n+']:checked');
    if(sel && sel.value === ans[n]) ok++;
  });
  if(ok===3){ complete(); }
  else fb("err"," Has acertado "+ok+"/3. Revisa la petición y vuelve a intentarlo.");
}

/* -------- PASO 3: Repeater -------- */
VIEWS[3] = function(){
  return '<span class="tag obj">Módulo 4 · Repeater</span>'
  + '<h2>Manipular peticiones con Repeater (IDOR)</h2>'
  + '<p class="desc">El endpoint <code>/api/accounts/123</code> devuelve las cuentas del usuario con id 123. '
  + 'Modifica el identificador en la petición y reenvía: si el servidor responde con datos de otro usuario, existe una <b>IDOR</b> '
  + '(Insecure Direct Object Reference).</p>'
  + '<div class="card"><h3>Repeater — petición editable</h3>'
  + '<pre>GET /api/accounts/<input type="text" id="repeaterId" value="123" style="width:80px;display:inline-block;padding:2px 6px"> HTTP/1.1\nHost: vulnbank.lab\nCookie: session=eyJhbGciOiJIUzI1NiJ9...</pre>'
  + '<div class="row"><button class="btn" onclick="doRepeat()">Send ▶</button></div></div>'
  + '<div class="card" id="respCard" style="display:none"><h3>Respuesta del servidor</h3><pre id="respBox"></pre><div id="fb" class="feedback"></div></div>';
};
function doRepeat(){
  var id = ($("repeaterId").value||"").trim();
  var card = $("respCard"); card.style.display = "block";
  if(id === "124"){
    $("respBox").textContent = 'HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"id":124,"owner":"maria.garcia","iban":"ES91 2100 **** 4321","balance":15420.75}';
    STATE.repeaterFound = true;
    fb("err","🚨 ¡Vulnerabilidad confirmada! La API devuelve datos de otro usuario (IDOR). Severidad: ALTA.");
    complete();
  } else if(id === "123"){
    $("respBox").textContent = 'HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"id":123,"owner":"angel","iban":"ES79 0182 **** 7788","balance":840.10}';
    fb("info","Datos del usuario legítimo. Prueba a cambiar el ID por el de otro usuario (p. ej. 124).");
  } else {
    $("respBox").textContent = 'HTTP/1.1 404 Not Found\n\n{"error":"account not found"}';
    fb("err","404 — cuenta inexistente. El IDOR se confirma cuando accedes a un recurso ajeno válido.");
  }
}

/* -------- PASO 4: Intruder -------- */
VIEWS[4] = function(){
  return '<span class="tag obj">Módulo 5 · Intruder</span>'
  + '<h2>Ataque Sniper con Intruder</h2>'
  + '<p class="desc">El endpoint de verificación <code>POST /api/verify</code> acepta un código de 2 dígitos. '
  + 'Monta un ataque <b>Sniper</b> con la lista de payloads 00–99 y localiza el código válido (pista: responde 200 OK).</p>'
  + '<div class="card"><h3>Payload positions</h3>'
  + '<pre>POST /api/verify HTTP/1.1\nHost: vulnbank.lab\nContent-Type: application/x-www-form-urlencoded\n\n<b>code=§00§</b></pre></div>'
  + '<div class="card"><h3>Lanzar ataque</h3>'
  + '<div class="row"><span class="pill">Attack type: Sniper</span><span class="pill">Payloads: 00 → 99</span>'
  + '<button class="btn" onclick="runIntruder()">Start attack ▶</button></div>'
  + '<div id="intruderRes"></div><div id="fb" class="feedback"></div></div>';
};
function runIntruder(){
  var res = $("intruderRes");
  var rows = "";
  var samples = ["00:403","07:403","23:403","41:403","42:200","88:403"];
  samples.forEach(function(s){
    var p = s.split(":"); var hit = p[1]==="200";
    rows += '<tr><td><code>code='+p[0]+'</code></td><td style="color:'+(hit?"var(--red)":"var(--muted)")+'">'+p[1]+'</td>'
      + '<td>'+(hit?'✔ token válido':'✘ inválido')+'</td>'+(hit?'<td><span class="sev high">HALLAZGO</span></td><td></td>':'<td>28 B</td><td>'+Math.round(20+Math.random()*30)+' ms</td>')+'</tr>';
  });
  res.innerHTML = '<table style="margin-top:12px"><tr><th>Payload</th><th>Status</th><th>Resultado</th><th>Etiqueta</th><th>Length / Time</th></tr>'+rows+'</table>';
  STATE.intruderFound = true;
  fb("err","🚨 El payload 42 responde 200 OK: el código de verificación es débil y admite enumeración por fuerza bruta. Severidad: MEDIA.");
  complete();
}

/* -------- PASO 5: Decoder -------- */
VIEWS[5] = function(){
  return '<span class="tag obj">Módulo 6 · Decoder</span>'
  + '<h2>Descodificar con Decoder</h2>'
  + '<p class="desc">En la cookie se detectó el valor sospechoso: <code>YWRtaW46YWRtaW4xMjM=</code>. '
  + 'Pégalo en el Decoder y descífralo (es Base64). Pista: revela credenciales en claro.</p>'
  + '<div class="card"><h3>Decoder</h3>'
  + '<div class="row"><input type="text" id="decIn" placeholder="Pega el valor aquí" style="flex:1;min-width:260px"></div>'
  + '<div class="row"><button class="btn ghost" onclick="doDecode(\'b64\')">Decode as Base64</button>'
  + '<button class="btn ghost" onclick="doDecode(\'url\')">Decode as URL</button>'
  + '<button class="btn ghost" onclick="doDecode(\'hex\')">Decode as Hex</button></div>'
  + '<pre id="decOut" style="margin-top:10px">—</pre><div id="fb" class="feedback"></div></div>';
};
function doDecode(mode){
  var v = $("decIn").value.trim();
  var out = $("decOut");
  if(mode==="b64" && v==="YWRtaW46YWRtaW4xMjM="){
    out.textContent = "→ admin:admin123";
    out.style.color = "var(--red)";
    STATE.decoded = true;
    fb("err","🚨 Base64 revela credenciales en claro: admin:admin123. Nunca se almacenan credenciales en Base64: no es cifrado.");
    complete();
  } else if(mode==="hex" && v==="YWRtaW46YWRtaW4xMjM="){
    out.textContent = "→ Y=57 W=57 … (hex sin significado)"; out.style.color="var(--muted)";
    fb("err","El resultado no es legible: este valor no es hex. Prueba con Base64.");
  } else if(mode==="url"){
    out.textContent = "→ YWRtaW46YWRtaW4xMjM%3D (sin cambios)"; out.style.color="var(--muted)";
    fb("err","URL-decode no revela nada útil. Pista: el «=» final y el alfabeto alfanumérico delatan Base64.");
  } else {
    out.textContent = "→ ???"; out.style.color="var(--muted)";
    fb("err","Copia el valor exacto YWRtaW46YWRtaW4xMjM= (aparece arriba) en el campo y prueba el decoder adecuado.");
  }
}
